name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'thunder-web/package-lock.json'

      - name: Install Dependencies
        working-directory: ./thunder-web
        run: npm ci

      - name: Run ESLint
        working-directory: ./thunder-web
        run: npm run lint

  test-and-build:
    name: Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'thunder-web/package-lock.json'

      - name: Install Dependencies
        working-directory: ./thunder-web
        run: npm ci

      - name: Run Unit Tests (Vitest + happy-dom)
        working-directory: ./thunder-web
        run: npm run test

      - name: Build Application
        working-directory: ./thunder-web
        run: npm run build

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js (20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'thunder-web/package-lock.json'

      - name: Install Dependencies
        working-directory: ./thunder-web
        run: npm ci

      - name: Install Playwright Browsers
        working-directory: ./thunder-web
        run: npx playwright install --with-deps chromium

      - name: Run Playwright Tests
        working-directory: ./thunder-web
        run: npm run test:e2e

  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan with TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

  vulnerabilities:
    name: Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Scan with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'
